listener 1883
listener 9001
protocol websockets

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

allow_anonymous true

# Max in-flight messages per client
max_inflight_messages 20

# Keep-alive
keepalive_interval 60
