# ESPHome template — Temperature/Motion Sensor (ESP8266)
substitutions:
  room: living
  device_id: motion
  device_name: "living-motion"

esphome:
  name: ${device_name}

esp8266:
  board: d1_mini

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

mqtt:
  broker: !secret mqtt_broker
  port: 1883
  on_connect:
    then:
      - mqtt.publish:
          topic: home/${room}/sensor/${device_id}/config
          payload: '{"capabilities":["motion","temperature","humidity"]}'

binary_sensor:
  - platform: gpio
    pin: D5
    name: "Motion"
    device_class: motion
    on_state:
      then:
        - mqtt.publish:
            topic: home/${room}/sensor/${device_id}/state
            payload: !lambda |-
              char buf[64];
              snprintf(buf, sizeof(buf), "{\"motion\":%s}", x ? "true" : "false");
              return std::string(buf);

sensor:
  - platform: dht
    pin: D4
    model: DHT22
    temperature:
      name: "Temperature"
      on_value:
        then:
          - mqtt.publish:
              topic: home/${room}/sensor/temp/state
              payload: !lambda |-
                char buf[64];
                snprintf(buf, sizeof(buf), "{\"temperature\":%.1f}", x);
                return std::string(buf);
    humidity:
      name: "Humidity"
      on_value:
        then:
          - mqtt.publish:
              topic: home/${room}/sensor/temp/state
              payload: !lambda |-
                char buf[64];
                snprintf(buf, sizeof(buf), "{\"humidity\":%.1f}", x);
                return std::string(buf);
    update_interval: 30s
